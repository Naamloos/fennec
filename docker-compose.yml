services:
  notifications:
    build:
      context: .
      dockerfile: Dev.Naamloos.Fennec.Notifications/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8080}:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials
    secrets:
      - firebase_credentials

secrets:
  firebase_credentials:
    file: ${FIREBASE_CREDENTIALS_FILE:-./secrets/firebase-service-account.json}
